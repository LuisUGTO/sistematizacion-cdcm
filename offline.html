<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#004B87" />
  <title>Sin conexión | Vinculación Cultural</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f6f9;color:#172033;font-family:Inter,"Segoe UI",Arial,sans-serif}.card{width:min(520px,100%);padding:34px;border:1px solid #d9e3ee;border-radius:24px;background:#fff;box-shadow:0 20px 55px rgba(0,75,135,.12);text-align:center}.mark{width:76px;height:76px;display:grid;place-items:center;margin:0 auto 20px;border-radius:24px;background:#eaf4fb;color:#004b87;font-size:34px;font-weight:900}small{display:block;color:#004b87;font-weight:900;letter-spacing:.8px;text-transform:uppercase}h1{margin:8px 0 12px;color:#003662;font-family:Georgia,serif;font-size:30px}p{margin:0;color:#526276;line-height:1.65}.note{margin-top:18px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:13px}button{margin-top:22px;padding:12px 20px;border:0;border-radius:11px;background:#004b87;color:#fff;font:inherit;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">⌁</div>
    <small>Vinculación Cultural</small>
    <h1>Sin conexión a internet</h1>
    <p>La aplicación está instalada, pero esta versión necesita conexión para consultar, guardar o validar información institucional.</p>
    <p class="note">Cuando recuperes la conexión, vuelve a intentarlo. No cierres una captura que todavía no hayas guardado.</p>
    <button type="button" onclick="window.location.reload()">Volver a intentar</button>
  </main>
</body>
</html>

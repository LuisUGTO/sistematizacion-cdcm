<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#004B87"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./assets/pwa/icon-180.png"><title>Activar acceso institucional</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6f9;font-family:Inter,Arial;color:#172033}.card{width:min(460px,calc(100% - 32px));padding:32px;background:white;border:1px solid #d9e3ee;border-radius:22px;box-shadow:0 18px 48px #004b8720}h1{margin:0 0 8px;color:#004b87}p{color:#64748b;line-height:1.5}label{display:block;margin:16px 0 6px;font-weight:700}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bfd1e4;border-radius:10px;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#004b87;color:white;font-weight:800;cursor:pointer}button:disabled{opacity:.55}.note{font-size:12px}</style></head><body><main class="card"><h1>Activa tu acceso</h1><p>Define una contraseña personal para ingresar al sistema. La administración nunca podrá verla.</p><form id="passwordForm"><label for="password">Nueva contraseña</label><input id="password" type="password" minlength="10" required autocomplete="new-password"><label for="confirmPassword">Confirmar contraseña</label><input id="confirmPassword" type="password" minlength="10" required autocomplete="new-password"><button id="savePassword" type="submit">Guardar y continuar</button></form><p class="note">Usa al menos 10 caracteres y evita reutilizar contraseñas.</p></main><script type="module" src="./js/set-password.js?v=7.4"></script></body></html>
